name: MCP Server Release

on:
  pull_request:
    paths:
      - "package.json"
      - "README.md"
      - "LICENSE"
      - "bin/**"
      - "dist/**"
      - ".github/workflows/mcp-server-release.yml"
  push:
    branches:
      - main
    tags:
      - "seojeom-mcp-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish seojeom-mcp to npm with Trusted Publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mcp-server-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      - name: Pack public tarball
        run: |
          mkdir -p artifacts/release-ci
          npm pack --json --pack-destination artifacts/release-ci

      - name: Probe onboarding contract
        run: node dist/standalone.js --print-claude-onboarding-json

      - name: Upload packed artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-release-ci
          path: artifacts/release-ci

  publish:
    needs: verify
    if: |
      github.repository == 'seojeom/seojeom-mcp' &&
      (
        startsWith(github.ref, 'refs/tags/seojeom-mcp-v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/seojeom-mcp-v')
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          EXPECTED_TAG="seojeom-mcp-v${PACKAGE_VERSION}"
          ACTUAL_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $ACTUAL_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish with Trusted Publishing + provenance
        run: npm publish --provenance
